<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOTR 2026 — Radial Route Visualization</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8e6e1;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  #controls {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #controls label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #555;
  }
  #controls select {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid #b0ada6;
    border-radius: 4px;
    background: #f5f3ef;
    color: #2d2d2d;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #controls select:focus {
    outline: none;
    border-color: #8fb5a3;
  }
  #viz {
    width: 1200px;
    height: 1200px;
  }
  svg text {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
</style>
</head>
<body>
<div id="controls">
  <label for="variant-select">Route</label>
  <select id="variant-select">
    <option value="standard">Standard</option>
    <option value="long">Long</option>
  </select>
</div>
<div id="viz"></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="data-inline.js"></script>
<script>
(function() {
  const allData = ROUTE_DATA;
  const W = 1200, H = 1200;
  const cx = W / 2, cy = H / 2;

  // Radii
  const R_INNER = 100;
  const R_ELEV_INNER = 105;
  const R_ELEV_OUTER = 240;
  const R_CP_INNER = 260;
  const R_CP_OUTER = 430;
  const R_REGION = 445;
  const R_STATS = 480;
  const R_DAY_LABEL = 540;
  const R_OUTER = 570;

  const COLORS = {
    teal: '#8fb5a3',
    tealLight: '#b8d4c8',
    tealDark: '#6a9483',
    gray: '#c8c5be',
    grayLight: '#d9d7d2',
    grayDark: '#a8a5a0',
    text: '#2d2d2d',
    textLight: '#666666',
    line: '#b0ada6',
    lineFaint: '#d0cdc7',
    black: '#1a1a1a',
    white: '#f5f3ef',
  };

  const dayColors = [COLORS.tealLight, COLORS.teal, COLORS.tealDark, COLORS.teal];

  function filterRoutes(variant) {
    // One route per day. Day 1 only has standard; for days 2-4 pick the selected variant.
    return [1, 2, 3, 4].map(day => {
      const candidates = allData.filter(d => d.day === day);
      return candidates.find(d => d.variant === variant) || candidates[0];
    });
  }

  function render(variant) {
    d3.select('#viz').selectAll('*').remove();

    const routes = filterRoutes(variant);

    const svg = d3.select('#viz')
      .append('svg')
      .attr('width', W)
      .attr('height', H)
      .attr('viewBox', `0 0 ${W} ${H}`);

    svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#e8e6e1');
    const g = svg.append('g').attr('transform', `translate(${cx},${cy})`);

    // Slice proportional to km per day
    const gapAngle = 0.04;
    const totalKm = d3.sum(routes, d => d.distance_km);
    const availableAngle = 2 * Math.PI - 4 * gapAngle;
    let curAngle = -Math.PI / 2;
    const dayLayouts = routes.map((route, i) => {
      const dayAngle = (route.distance_km / totalKm) * availableAngle;
      const startAngle = curAngle;
      curAngle += dayAngle + gapAngle;
      return {
        route,
        day: i + 1,
        startAngle,
        endAngle: startAngle + (route.distance_km / totalKm) * availableAngle,
        midAngle: startAngle + (route.distance_km / totalKm) * availableAngle / 2,
        color: dayColors[i],
      };
    });

    // Concentric reference circles
    [R_INNER, R_ELEV_OUTER, R_CP_INNER, R_CP_OUTER, R_OUTER].forEach(r => {
      g.append('circle')
        .attr('cx', 0).attr('cy', 0).attr('r', r)
        .attr('fill', 'none')
        .attr('stroke', COLORS.lineFaint)
        .attr('stroke-width', r === R_OUTER ? 1.5 : 0.5);
    });

    const maxElev = d3.max(routes, d => d3.max(d.elevations));

    for (const dl of dayLayouts) {
      const { route, startAngle, endAngle, midAngle, color } = dl;

      // Day separator lines
      for (const angle of [startAngle, endAngle]) {
        g.append('line')
          .attr('x1', R_INNER * Math.cos(angle))
          .attr('y1', R_INNER * Math.sin(angle))
          .attr('x2', R_OUTER * Math.cos(angle))
          .attr('y2', R_OUTER * Math.sin(angle))
          .attr('stroke', COLORS.lineFaint)
          .attr('stroke-width', 0.75);
      }

      // Day label
      const labelR = R_DAY_LABEL;
      const rotation = (midAngle * 180 / Math.PI) + 90;
      const flip = midAngle > Math.PI / 2 && midAngle < 3 * Math.PI / 2;

      g.append('text')
        .attr('x', labelR * Math.cos(midAngle))
        .attr('y', labelR * Math.sin(midAngle))
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'middle')
        .attr('transform', `rotate(${flip ? rotation + 180 : rotation}, ${labelR * Math.cos(midAngle)}, ${labelR * Math.sin(midAngle)})`)
        .attr('font-size', '22px')
        .attr('font-weight', '700')
        .attr('letter-spacing', '3px')
        .attr('fill', COLORS.text)
        .text(`DAY ${dl.day}`);

      // Elevation profile
      const elevs = route.elevations;
      const n = elevs.length;
      const pathData = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const angle = startAngle + t * (endAngle - startAngle);
        const elev = elevs[Math.min(i, n - 1)];
        const r = R_ELEV_INNER + (elev / maxElev) * (R_ELEV_OUTER - R_ELEV_INNER);
        pathData.push([r * Math.cos(angle), r * Math.sin(angle)]);
      }
      const innerPath = [];
      for (let i = n; i >= 0; i--) {
        const t = i / n;
        const angle = startAngle + t * (endAngle - startAngle);
        innerPath.push([R_ELEV_INNER * Math.cos(angle), R_ELEV_INNER * Math.sin(angle)]);
      }
      const line = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveLinearClosed);
      g.append('path')
        .attr('d', line([...pathData, ...innerPath]))
        .attr('fill', COLORS.black)
        .attr('fill-opacity', 0.85)
        .attr('stroke', 'none');

      // Tick marks (every 5km)
      const totalDist = route.distance_km;
      const nTicks = Math.floor(totalDist / 5);
      for (let t = 0; t <= nTicks; t++) {
        const frac = (t * 5) / totalDist;
        const angle = startAngle + frac * (endAngle - startAngle);
        const r1 = R_ELEV_OUTER + 2;
        const r2 = R_ELEV_OUTER + (t % 2 === 0 ? 8 : 5);
        g.append('line')
          .attr('x1', r1 * Math.cos(angle))
          .attr('y1', r1 * Math.sin(angle))
          .attr('x2', r2 * Math.cos(angle))
          .attr('y2', r2 * Math.sin(angle))
          .attr('stroke', COLORS.textLight)
          .attr('stroke-width', 0.5);
      }

      // Course point region bands
      const totalDistM = route.distance_km * 1000;
      const keyPts = route.course_points.filter(cp => {
        const skip = ['left', 'right', 'straight', 'slight_left', 'slight_right', 'sharp_left', 'sharp_right'];
        return !skip.includes(cp.type) && cp.name.length > 5;
      });

      const segments = [];
      for (let i = 0; i < keyPts.length; i++) {
        const start = keyPts[i].dist;
        const end = i < keyPts.length - 1 ? keyPts[i + 1].dist : totalDistM;
        if (end - start > totalDistM * 0.02) {
          segments.push({ name: keyPts[i].name, startFrac: start / totalDistM, endFrac: end / totalDistM });
        }
      }

      segments.forEach((seg, si) => {
        if (si % 3 !== 0) return;
        const a1 = startAngle + seg.startFrac * (endAngle - startAngle);
        const a2 = startAngle + seg.endFrac * (endAngle - startAngle);
        g.append('path')
          .attr('d', d3.arc().innerRadius(R_CP_INNER).outerRadius(R_CP_OUTER)
            .startAngle(a1 + Math.PI / 2).endAngle(a2 + Math.PI / 2))
          .attr('fill', color)
          .attr('fill-opacity', 0.4)
          .attr('stroke', 'none');
      });

      // Radial grid lines in course point area
      for (let i = 0; i <= 20; i++) {
        const frac = i / 20;
        const angle = startAngle + frac * (endAngle - startAngle);
        g.append('line')
          .attr('x1', R_CP_INNER * Math.cos(angle))
          .attr('y1', R_CP_INNER * Math.sin(angle))
          .attr('x2', R_CP_OUTER * Math.cos(angle))
          .attr('y2', R_CP_OUTER * Math.sin(angle))
          .attr('stroke', COLORS.lineFaint)
          .attr('stroke-width', 0.3);
      }

      // Concentric rings in course point area
      for (let r = R_CP_INNER; r <= R_CP_OUTER; r += 30) {
        g.append('path')
          .attr('d', d3.arc().innerRadius(r).outerRadius(r + 0.5)
            .startAngle(startAngle + Math.PI / 2).endAngle(endAngle + Math.PI / 2))
          .attr('fill', COLORS.lineFaint)
          .attr('stroke', 'none');
      }

      // Course point labels
      const labelCandidates = [];
      const seen = new Set();
      for (const cp of route.course_points) {
        const shortName = cp.name.substring(0, 10);
        if (!seen.has(shortName) && cp.name.length > 5) {
          seen.add(shortName);
          labelCandidates.push(cp);
        }
      }
      const maxLabels = 10;
      const labelStep = Math.max(1, Math.floor(labelCandidates.length / maxLabels));
      const selectedLabels = labelCandidates.filter((_, i) => i % labelStep === 0).slice(0, maxLabels);

      selectedLabels.forEach(cp => {
        const frac = cp.dist / totalDistM;
        const angle = startAngle + frac * (endAngle - startAngle);
        const cpLabelR = R_CP_INNER + 30;
        const rot = (angle * 180 / Math.PI);
        const cpFlip = angle > 0 && angle < Math.PI;
        let name = cp.name;
        if (name.length > 14) name = name.substring(0, 14);

        g.append('text')
          .attr('x', cpLabelR * Math.cos(angle))
          .attr('y', cpLabelR * Math.sin(angle))
          .attr('text-anchor', cpFlip ? 'end' : 'start')
          .attr('dominant-baseline', 'middle')
          .attr('transform', `rotate(${cpFlip ? rot + 180 : rot}, ${cpLabelR * Math.cos(angle)}, ${cpLabelR * Math.sin(angle)})`)
          .attr('font-size', '7px')
          .attr('fill', COLORS.textLight)
          .attr('font-weight', '400')
          .text(name);
      });

      // Route label
      const regionR = R_REGION;
      const regionRot = (midAngle * 180 / Math.PI) + 90;
      g.append('text')
        .attr('x', regionR * Math.cos(midAngle))
        .attr('y', regionR * Math.sin(midAngle))
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'middle')
        .attr('transform', `rotate(${flip ? regionRot + 180 : regionRot}, ${regionR * Math.cos(midAngle)}, ${regionR * Math.sin(midAngle)})`)
        .attr('font-size', '11px')
        .attr('font-weight', '600')
        .attr('letter-spacing', '1.5px')
        .attr('fill', COLORS.text)
        .text(route.label.toUpperCase());

      // Stats
      const statsR = R_STATS;
      const statsRot = (midAngle * 180 / Math.PI) + 90;
      const statsText = `${route.distance_km} km · ${Math.round(route.elevation_gain)}m climbing`;
      g.append('text')
        .attr('x', statsR * Math.cos(midAngle))
        .attr('y', statsR * Math.sin(midAngle))
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'middle')
        .attr('transform', `rotate(${flip ? statsRot + 180 : statsRot}, ${statsR * Math.cos(midAngle)}, ${statsR * Math.sin(midAngle)})`)
        .attr('font-size', '8px')
        .attr('font-weight', '400')
        .attr('fill', COLORS.textLight)
        .text(statsText);

      // Date label
      const dateR = R_OUTER - 10;
      const dateRot = (midAngle * 180 / Math.PI) + 90;
      g.append('text')
        .attr('x', dateR * Math.cos(midAngle))
        .attr('y', dateR * Math.sin(midAngle))
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'middle')
        .attr('transform', `rotate(${flip ? dateRot + 180 : dateRot}, ${dateR * Math.cos(midAngle)}, ${dateR * Math.sin(midAngle)})`)
        .attr('font-size', '7px')
        .attr('font-weight', '400')
        .attr('fill', COLORS.textLight)
        .text(route.date);
    }

    // Center branding
    g.append('circle').attr('cx', 0).attr('cy', 0).attr('r', R_INNER).attr('fill', COLORS.black);

    g.append('text').attr('x', 0).attr('y', -20)
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('font-size', '14px').attr('font-weight', '700')
      .attr('letter-spacing', '4px').attr('fill', COLORS.white)
      .text('KING OF');

    g.append('text').attr('x', 0).attr('y', 0)
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('font-size', '22px').attr('font-weight', '800')
      .attr('letter-spacing', '3px').attr('fill', COLORS.white)
      .text('THE ROAD');

    g.append('text').attr('x', 0).attr('y', 22)
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('font-size', '11px').attr('font-weight', '400')
      .attr('letter-spacing', '2px').attr('fill', COLORS.tealLight)
      .text('AVIGNON 2026');

    g.append('text').attr('x', 0).attr('y', 42)
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('font-size', '7px').attr('font-weight', '400')
      .attr('letter-spacing', '1px').attr('fill', COLORS.grayDark)
      .text('MAY 28 – JUN 1');

    // Subtitle
    svg.append('text')
      .attr('x', cx).attr('y', H - 10)
      .attr('text-anchor', 'middle')
      .attr('font-size', '9px')
      .attr('fill', COLORS.textLight)
      .attr('letter-spacing', '2px')
      .text('SUPPORTING MÉDECINS SANS FRONTIÈRES');
  }

  // Initial render
  render('standard');

  // Dropdown handler
  document.getElementById('variant-select').addEventListener('change', function() {
    render(this.value);
  });
})();
</script>
</body>
</html>
