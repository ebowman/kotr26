<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOTR 2026 — Radial Route Visualization</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #e8e6e1;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  #controls {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #controls label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #555;
  }
  #controls select {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid #b0ada6;
    border-radius: 4px;
    background: #f5f3ef;
    color: #2d2d2d;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #controls select:focus {
    outline: none;
    border-color: #8fb5a3;
  }
  #viz {
    width: 1200px;
    height: 1200px;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  #viz:active {
    cursor: grabbing;
  }
  svg text {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="controls">
  <label for="variant-select">Route</label>
  <select id="variant-select">
    <option value="standard">Standard</option>
    <option value="long">Long</option>
  </select>
</div>
<div id="viz"></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../routes/viz-data.js?v=d8707e6"></script>
<script>
(function() {
  const allData = ROUTE_DATA;
  const W = 1200, H = 1200;
  const cx = W / 2, cy = H / 2;

  const R_INNER = 100;
  const R_ELEV_INNER = 105;
  const R_ELEV_OUTER = 240;
  const R_CP_INNER = 260;
  const R_CP_OUTER = 430;
  const R_REGION = 445;
  const R_STATS = 480;
  const R_DAY_LABEL = 540;
  const R_OUTER = 570;

  const COLORS = {
    teal: '#8fb5a3',
    tealLight: '#b8d4c8',
    tealDark: '#6a9483',
    gray: '#c8c5be',
    grayLight: '#d9d7d2',
    grayDark: '#a8a5a0',
    text: '#2d2d2d',
    textLight: '#666666',
    line: '#b0ada6',
    lineFaint: '#d0cdc7',
    black: '#1a1a1a',
    white: '#f5f3ef',
  };

  const dayColors = [COLORS.tealLight, COLORS.teal, COLORS.tealDark, COLORS.teal];

  function filterRoutes(variant) {
    return [1, 2, 3, 4].map(day => {
      const candidates = allData.filter(d => d.day === day);
      return candidates.find(d => d.variant === variant) || candidates[0];
    });
  }

  // Normalize angle to [0, 360)
  function normAngle(deg) {
    return ((deg % 360) + 360) % 360;
  }

  // Check if a text rotation (in degrees) would render upside-down on screen.
  // Text is upside-down when its effective screen rotation is in (90, 270).
  // textRotDeg: the local SVG rotation of the text element
  // groupRotDeg: the rotation applied to the parent <g> group
  const flipState = new Map();
  const HYSTERESIS = 10;

  function isUpsideDown(textRotDeg, groupRotDeg, key) {
    const effective = normAngle(textRotDeg + groupRotDeg);
    const prev = key != null ? flipState.get(key) : undefined;

    let flipped;
    if (prev === true) {
      flipped = effective > (90 - HYSTERESIS) && effective < (270 + HYSTERESIS);
    } else if (prev === false) {
      flipped = effective > (90 + HYSTERESIS) && effective < (270 - HYSTERESIS);
    } else {
      flipped = effective > 90 && effective < 270;
    }

    if (key != null) flipState.set(key, flipped);
    return flipped;
  }

  // Place a radial text label (perpendicular to radius, like "DAY 1")
  function placeRadialText(parent, angle, radius, text, opts, rotDeg) {
    const angleDeg = angle * 180 / Math.PI;
    const baseDeg = angleDeg + 90; // perpendicular to radius
    const key = `r_${radius}_${text}`;
    const flip = isUpsideDown(baseDeg, rotDeg, key);
    const rot = flip ? baseDeg + 180 : baseDeg;
    const x = radius * Math.cos(angle);
    const y = radius * Math.sin(angle);

    const el = parent.append('text')
      .attr('x', x).attr('y', y)
      .attr('text-anchor', opts.anchor || 'middle')
      .attr('dominant-baseline', 'middle')
      .attr('transform', `rotate(${rot}, ${x}, ${y})`)
      .attr('font-size', opts.fontSize || '10px')
      .attr('font-weight', opts.fontWeight || '400')
      .attr('fill', opts.fill || COLORS.text)
      .text(text);

    if (opts.letterSpacing) el.attr('letter-spacing', opts.letterSpacing);
    return el;
  }

  // Place a tangential text label (along the arc, like town names)
  function placeTangentText(parent, angle, radius, text, opts, rotDeg) {
    const angleDeg = angle * 180 / Math.PI;
    const baseDeg = angleDeg; // tangent to arc
    const key = `t_${radius}_${text}`;
    const flip = isUpsideDown(baseDeg, rotDeg, key);
    const rot = flip ? baseDeg + 180 : baseDeg;
    const x = radius * Math.cos(angle);
    const y = radius * Math.sin(angle);

    const el = parent.append('text')
      .attr('x', x).attr('y', y)
      .attr('text-anchor', flip ? 'end' : 'start')
      .attr('dominant-baseline', 'middle')
      .attr('transform', `rotate(${rot}, ${x}, ${y})`)
      .attr('font-size', opts.fontSize || '7px')
      .attr('font-weight', opts.fontWeight || '400')
      .attr('fill', opts.fill || COLORS.textLight)
      .text(text);

    return el;
  }

  let currentVariant = 'standard';
  let currentLayouts = null;

  function buildLayouts(variant) {
    const routes = filterRoutes(variant);
    const gapAngle = 0.04;
    const totalKm = d3.sum(routes, d => d.distance_km);
    const availableAngle = 2 * Math.PI - 4 * gapAngle;
    let curAngle = -Math.PI / 2;
    return routes.map((route, i) => {
      const dayAngle = (route.distance_km / totalKm) * availableAngle;
      const startAngle = curAngle;
      curAngle += dayAngle + gapAngle;
      return {
        route, day: i + 1, startAngle,
        endAngle: startAngle + dayAngle,
        midAngle: startAngle + dayAngle / 2,
        color: dayColors[i],
      };
    });
  }

  function renderShapes(g, layouts) {
    const maxElev = d3.max(layouts, dl => d3.max(dl.route.elevations));

    // Concentric reference circles
    [R_INNER, R_ELEV_OUTER, R_CP_INNER, R_CP_OUTER, R_OUTER].forEach(r => {
      g.append('circle').attr('cx', 0).attr('cy', 0).attr('r', r)
        .attr('fill', 'none').attr('stroke', COLORS.lineFaint)
        .attr('stroke-width', r === R_OUTER ? 1.5 : 0.5);
    });

    for (const dl of layouts) {
      const { route, startAngle, endAngle, color } = dl;

      // Day separator lines
      for (const angle of [startAngle, endAngle]) {
        g.append('line')
          .attr('x1', R_INNER * Math.cos(angle)).attr('y1', R_INNER * Math.sin(angle))
          .attr('x2', R_OUTER * Math.cos(angle)).attr('y2', R_OUTER * Math.sin(angle))
          .attr('stroke', COLORS.lineFaint).attr('stroke-width', 0.75);
      }

      // Elevation profile
      const elevs = route.elevations;
      const n = elevs.length;
      const pathData = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const angle = startAngle + t * (endAngle - startAngle);
        const elev = elevs[Math.min(i, n - 1)];
        const r = R_ELEV_INNER + (elev / maxElev) * (R_ELEV_OUTER - R_ELEV_INNER);
        pathData.push([r * Math.cos(angle), r * Math.sin(angle)]);
      }
      const innerPath = [];
      for (let i = n; i >= 0; i--) {
        const t = i / n;
        const angle = startAngle + t * (endAngle - startAngle);
        innerPath.push([R_ELEV_INNER * Math.cos(angle), R_ELEV_INNER * Math.sin(angle)]);
      }
      g.append('path')
        .attr('d', d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveLinearClosed)([...pathData, ...innerPath]))
        .attr('fill', COLORS.black).attr('fill-opacity', 0.85).attr('stroke', 'none');

      // Tick marks (every 5km)
      const totalDist = route.distance_km;
      const nTicks = Math.floor(totalDist / 5);
      for (let t = 0; t <= nTicks; t++) {
        const frac = (t * 5) / totalDist;
        const angle = startAngle + frac * (endAngle - startAngle);
        const r1 = R_ELEV_OUTER + 2;
        const r2 = R_ELEV_OUTER + (t % 2 === 0 ? 8 : 5);
        g.append('line')
          .attr('x1', r1 * Math.cos(angle)).attr('y1', r1 * Math.sin(angle))
          .attr('x2', r2 * Math.cos(angle)).attr('y2', r2 * Math.sin(angle))
          .attr('stroke', COLORS.textLight).attr('stroke-width', 0.5);
      }

      // Town/POI region bands from Mapbox data
      const totalDistM = route.distance_km * 1000;
      const poiKey = `day${dl.day}_${route.variant}`;
      const pois = (typeof POI_DATA !== 'undefined' && POI_DATA[poiKey]) || [];
      pois.forEach((poi, pi) => {
        if (pi % 2 !== 0) return; // alternate bands
        const nextDist = pi < pois.length - 1 ? pois[pi + 1].dist : totalDistM;
        const a1 = startAngle + (poi.dist / totalDistM) * (endAngle - startAngle);
        const a2 = startAngle + (nextDist / totalDistM) * (endAngle - startAngle);
        g.append('path')
          .attr('d', d3.arc().innerRadius(R_CP_INNER).outerRadius(R_CP_OUTER)
            .startAngle(a1 + Math.PI / 2).endAngle(a2 + Math.PI / 2))
          .attr('fill', color).attr('fill-opacity', 0.35).attr('stroke', 'none');
      });

      // Radial grid lines
      for (let i = 0; i <= 20; i++) {
        const angle = startAngle + (i / 20) * (endAngle - startAngle);
        g.append('line')
          .attr('x1', R_CP_INNER * Math.cos(angle)).attr('y1', R_CP_INNER * Math.sin(angle))
          .attr('x2', R_CP_OUTER * Math.cos(angle)).attr('y2', R_CP_OUTER * Math.sin(angle))
          .attr('stroke', COLORS.lineFaint).attr('stroke-width', 0.3);
      }

      // Concentric rings
      for (let r = R_CP_INNER; r <= R_CP_OUTER; r += 30) {
        g.append('path')
          .attr('d', d3.arc().innerRadius(r).outerRadius(r + 0.5)
            .startAngle(startAngle + Math.PI / 2).endAngle(endAngle + Math.PI / 2))
          .attr('fill', COLORS.lineFaint).attr('stroke', 'none');
      }
    }

    // Center circle
    g.append('circle').attr('cx', 0).attr('cy', 0).attr('r', R_INNER).attr('fill', COLORS.black);
  }

  function renderLabels(g, layouts, rotDeg) {
    // Remove old labels
    g.selectAll('*').remove();

    for (const dl of layouts) {
      const { route, startAngle, endAngle, midAngle } = dl;
      const totalDistM = route.distance_km * 1000;

      // Day label
      placeRadialText(g, midAngle, R_DAY_LABEL, `DAY ${dl.day}`, {
        fontSize: '22px', fontWeight: '700', letterSpacing: '3px', fill: COLORS.text
      }, rotDeg);

      // Route label
      placeRadialText(g, midAngle, R_REGION, route.label.toUpperCase(), {
        fontSize: '11px', fontWeight: '600', letterSpacing: '1.5px', fill: COLORS.text
      }, rotDeg);

      // Stats
      placeRadialText(g, midAngle, R_STATS,
        `${route.distance_km} km · ${Math.round(route.elevation_gain)}m climbing`, {
        fontSize: '8px', fill: COLORS.textLight
      }, rotDeg);

      // Date
      placeRadialText(g, midAngle, R_OUTER - 10, route.date, {
        fontSize: '7px', fill: COLORS.textLight
      }, rotDeg);

      // Town/POI labels from Mapbox data
      const poiKey = `day${dl.day}_${route.variant}`;
      const pois = (typeof POI_DATA !== 'undefined' && POI_DATA[poiKey]) || [];
      pois.forEach(poi => {
        const frac = poi.dist / totalDistM;
        const angle = startAngle + frac * (endAngle - startAngle);
        // Larger text for town names (like reference image)
        placeTangentText(g, angle, R_CP_INNER + 20, poi.name.toUpperCase(), {
          fontSize: '7.5px', fontWeight: '500', fill: COLORS.text
        }, rotDeg);
      });
    }

    // Center branding (counter-rotate so it stays upright)
    const brand = g.append('g').attr('transform', `rotate(${-rotDeg})`);

    brand.append('text').attr('x', 0).attr('y', -20)
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('font-size', '14px').attr('font-weight', '700')
      .attr('letter-spacing', '4px').attr('fill', COLORS.white)
      .text('KING OF');

    brand.append('text').attr('x', 0).attr('y', 0)
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('font-size', '22px').attr('font-weight', '800')
      .attr('letter-spacing', '3px').attr('fill', COLORS.white)
      .text('THE ROAD');

    brand.append('text').attr('x', 0).attr('y', 22)
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('font-size', '11px').attr('font-weight', '400')
      .attr('letter-spacing', '2px').attr('fill', COLORS.tealLight)
      .text('AVIGNON 2026');

    brand.append('text').attr('x', 0).attr('y', 42)
      .attr('text-anchor', 'middle').attr('dominant-baseline', 'middle')
      .attr('font-size', '7px').attr('font-weight', '400')
      .attr('letter-spacing', '1px').attr('fill', COLORS.grayDark)
      .text('MAY 28 – JUN 1');
  }

  let svg, gData, gLabels, gSubtitle;

  function render(variant) {
    d3.select('#viz').selectAll('*').remove();
    currentVariant = variant;
    currentLayouts = buildLayouts(variant);

    svg = d3.select('#viz').append('svg')
      .attr('width', W).attr('height', H)
      .attr('viewBox', `0 0 ${W} ${H}`);

    svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#e8e6e1');

    // Shapes group: rotates with drag
    gData = svg.append('g').attr('transform', `translate(${cx},${cy}) rotate(${rotation})`);
    renderShapes(gData, currentLayouts);

    // Labels group: also rotated with shapes, but text orientations compensate
    gLabels = svg.append('g').attr('transform', `translate(${cx},${cy}) rotate(${rotation})`);
    renderLabels(gLabels, currentLayouts, rotation);

    // Subtitle (fixed, outside the wheel) — links to donation page
    const link = svg.append('a')
      .attr('href', 'https://www.justgiving.com/page/eric-bowman-kotr26')
      .attr('target', '_blank');
    link.append('text')
      .attr('x', cx).attr('y', H - 10)
      .attr('text-anchor', 'middle')
      .attr('font-size', '9px')
      .attr('fill', '#4a7c6b')
      .attr('letter-spacing', '2px')
      .attr('text-decoration', 'underline')
      .style('cursor', 'pointer')
      .style('pointer-events', 'auto')
      .text('SUPPORTING MÉDECINS SANS FRONTIÈRES');
  }

  // --- Drag-to-rotate ---
  let rotation = 0;
  let velocity = 0;
  let dragging = false;
  let lastAngle = 0;
  let animFrame = null;

  function getAngle(x, y) {
    const rect = document.getElementById('viz').getBoundingClientRect();
    const dx = x - (rect.left + rect.width / 2);
    const dy = y - (rect.top + rect.height / 2);
    return Math.atan2(dy, dx) * 180 / Math.PI;
  }

  function applyRotation() {
    if (gData) gData.attr('transform', `translate(${cx},${cy}) rotate(${rotation})`);
    if (gLabels) {
      gLabels.attr('transform', `translate(${cx},${cy}) rotate(${rotation})`);
      renderLabels(gLabels, currentLayouts, rotation);
    }
  }

  function drift() {
    if (dragging) return;
    if (Math.abs(velocity) < 0.01) { velocity = 0; return; }
    velocity *= 0.95;
    rotation += velocity;
    applyRotation();
    animFrame = requestAnimationFrame(drift);
  }

  const vizEl = document.getElementById('viz');

  vizEl.addEventListener('pointerdown', function(e) {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'OPTION') return;
    dragging = true;
    velocity = 0;
    lastAngle = getAngle(e.clientX, e.clientY);
    if (animFrame) cancelAnimationFrame(animFrame);
    vizEl.setPointerCapture(e.pointerId);
  });

  vizEl.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    const angle = getAngle(e.clientX, e.clientY);
    let delta = angle - lastAngle;
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    velocity = delta;
    rotation += delta;
    lastAngle = angle;
    applyRotation();
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    animFrame = requestAnimationFrame(drift);
  }

  vizEl.addEventListener('pointerup', endDrag);
  vizEl.addEventListener('pointercancel', endDrag);

  // Initial render
  render('standard');

  // Dropdown handler
  document.getElementById('variant-select').addEventListener('change', function() {
    render(this.value);
  });
})();
</script>

</div>
