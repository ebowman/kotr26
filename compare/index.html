<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOTR 2026 - Route Comparison</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚴</text></svg>">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="../js/config.js?v=c4ada92"></script>
<script src="../routes/viz-data.js?v=c4ada92"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e8e6e1;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #2d2d2d;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px 40px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 14px;
    color: #666666;
    margin-bottom: 24px;
  }

  .grid-wrapper {
    display: grid;
    grid-template-columns: 80px repeat(4, 280px);
    grid-template-rows: 36px repeat(2, 320px);
    gap: 10px;
    align-items: start;
  }

  .col-header {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #666666;
    padding-top: 8px;
  }

  .row-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #666666;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 320px;
  }

  .corner { /* top-left empty cell */ }

  .cell {
    width: 280px;
    height: 320px;
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: box-shadow 0.2s;
    border: 2px solid transparent;
  }

  .cell:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }

  .cell.selected {
    border-color: #6a9483;
    box-shadow: 0 2px 16px rgba(106,148,131,0.3);
  }

  .cell-header {
    padding: 10px 12px 0;
    position: relative;
    z-index: 2;
  }

  .cell-day {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #666666;
  }

  .cell-label {
    font-size: 14px;
    font-weight: 600;
    color: #2d2d2d;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cell-stats {
    font-size: 11px;
    color: #666666;
    margin-top: 2px;
  }

  .cell-empty {
    width: 280px;
    height: 320px;
    background: #f2f0ec;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #b0ada6;
    border: 2px dashed #d0cdc7;
  }

  .cell-empty .empty-label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .cell-empty .empty-sub {
    font-size: 11px;
    margin-top: 4px;
  }

  .map-area {
    width: 280px;
    height: 180px;
    position: relative;
  }

  .map-bg {
    position: absolute;
    top: 0; left: 0;
    width: 280px;
    height: 180px;
    opacity: 0.75;
    border-radius: 0;
  }

  .map-area svg {
    position: relative;
    z-index: 1;
  }

  .elevation-area {
    width: 280px;
    height: 60px;
    position: absolute;
    bottom: 0;
    left: 0;
    z-index: 2;
    cursor: crosshair;
  }

  .elev-tooltip {
    position: absolute;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(45,45,45,0.9);
    color: #f5f3ef;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 3;
    display: none;
  }

  .nav-links {
    margin-top: 28px;
    font-size: 14px;
    color: #666666;
  }

  .nav-links a {
    color: #666666;
    text-decoration: none;
    margin: 0 6px;
    transition: color 0.2s;
  }

  .nav-links a:hover {
    color: #2d2d2d;
  }

  .nav-links .sep {
    color: #b0ada6;
  }

  .donation {
    margin-top: 12px;
    font-size: 13px;
  }

  .donation a {
    color: #4a7c6b;
    text-decoration: underline;
  }
</style>
</head>
<body>

<h1>ROUTE COMPARISON</h1>
<p class="subtitle">KOTR 2026 &middot; King of the Road cycling event &middot; Provence</p>

<div class="grid-wrapper" id="grid"></div>

<div class="nav-links">
  <a href="../index.html">Home</a>
  <span class="sep">|</span>
  <a href="../radial/index.html">Radial</a>
  <span class="sep">|</span>
  <a href="../skyline/index.html">Skyline</a>
  <span class="sep">|</span>
  <a href="../pace/index.html">Pace</a>
</div>

<p class="donation">
  Supporting <a href="https://www.justgiving.com/page/eric-bowman-kotr26">M&eacute;decins Sans Fronti&egrave;res</a>
</p>

<script>
(function() {
  // Token loaded from shared config
  const MAPBOX_TOKEN = window.KOTR_CONFIG.MAPBOX_TOKEN;

  const COLORS = {
    teal: '#8fb5a3',
    tealLight: '#b8d4c8',
    tealDark: '#6a9483',
    text: '#2d2d2d',
    textLight: '#666666',
    line: '#b0ada6',
    lineFaint: '#d0cdc7'
  };

  const COS44 = Math.cos(44 * Math.PI / 180);

  const CELL_W = 280;
  const CELL_H = 320;
  const MAP_H = 180;
  const ELEV_H = 60;
  const PAD = 15;

  // Build route lookup
  const routes = {};
  ROUTE_DATA.forEach(r => {
    if (!routes[r.day]) routes[r.day] = {};
    routes[r.day][r.variant] = r;
  });

  function gpsKey(day, variant) {
    return 'day' + day + '_' + variant;
  }

  let selectedKey = null;
  const grid = document.getElementById('grid');
  const cellMap = {};

  // Corner
  grid.appendChild(Object.assign(document.createElement('div'), { className: 'corner' }));

  // Column headers
  for (let d = 1; d <= 4; d++) {
    const ch = document.createElement('div');
    ch.className = 'col-header';
    ch.textContent = 'DAY ' + d;
    grid.appendChild(ch);
  }

  // Compute Mapbox Static Image URL for a set of GPS bounds
  function mapboxUrl(bounds, width, height) {
    const pad = 0.008; // ~800m padding around route
    const west = bounds.minLon - pad;
    const south = bounds.minLat - pad;
    const east = bounds.maxLon + pad;
    const north = bounds.maxLat + pad;
    const bbox = west + ',' + south + ',' + east + ',' + north;
    // Use light style for subtle background
    return 'https://api.mapbox.com/styles/v1/mapbox/outdoors-v12/static/[' + bbox + ']/' +
      width + 'x' + height + '@2x?access_token=' + MAPBOX_TOKEN +
      '&attribution=false&logo=false';
  }

  // Rows
  ['standard', 'long'].forEach(variant => {
    const rl = document.createElement('div');
    rl.className = 'row-label';
    rl.textContent = variant.toUpperCase();
    grid.appendChild(rl);

    for (let day = 1; day <= 4; day++) {
      const key = gpsKey(day, variant);
      const route = routes[day] && routes[day][variant];
      const gps = ROUTE_GPS[key];

      if (!route || !gps) {
        const empty = document.createElement('div');
        empty.className = 'cell-empty';
        empty.innerHTML = '<div class="empty-label">Standard Only</div><div class="empty-sub">Day ' + day + ' has one route</div>';
        grid.appendChild(empty);
        continue;
      }

      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.key = key;
      cell.dataset.day = day;
      cell.dataset.variant = variant;
      cellMap[key] = cell;

      // Header
      const header = document.createElement('div');
      header.className = 'cell-header';
      header.innerHTML =
        '<div class="cell-day">DAY ' + day + '</div>' +
        '<div class="cell-label">' + route.label + '</div>' +
        '<div class="cell-stats">' + Math.round(route.distance_km) + ' km &middot; ' + Math.round(route.elevation_gain) + 'm climbing</div>';
      cell.appendChild(header);

      // Map area with Mapbox background
      const mapDiv = document.createElement('div');
      mapDiv.className = 'map-area';

      // Background map image
      const img = document.createElement('img');
      img.className = 'map-bg';
      img.src = mapboxUrl(gps.bounds, CELL_W, MAP_H);
      img.alt = '';
      img.loading = 'lazy';
      mapDiv.appendChild(img);

      cell.appendChild(mapDiv);

      // Elevation
      const elevDiv = document.createElement('div');
      elevDiv.className = 'elevation-area';
      cell.appendChild(elevDiv);

      grid.appendChild(cell);

      const mapResult = drawMap(mapDiv, gps, variant, key);
      const elevResult = drawElevation(elevDiv, route.elevations, variant);
      wireScrubber(elevDiv, elevResult, mapResult, route, cell);
      cell.addEventListener('click', () => toggleSelect(key, day, variant));
    }
  });

  function projectCoords(coords) {
    return coords.map(c => [c[0] * COS44, -c[1]]);
  }

  function fitProjection(projected, width, height, padding) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    projected.forEach(p => {
      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[1] > maxY) maxY = p[1];
    });

    const dataW = maxX - minX || 1;
    const dataH = maxY - minY || 1;
    const availW = width - 2 * padding;
    const availH = height - 2 * padding;
    const scale = Math.min(availW / dataW, availH / dataH);

    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    const ox = width / 2;
    const oy = height / 2;

    return function(p) {
      return [
        ox + (p[0] - cx) * scale,
        oy + (p[1] - cy) * scale
      ];
    };
  }

  function drawMap(container, gps, variant, key) {
    const svg = d3.select(container)
      .append('svg')
      .attr('width', CELL_W)
      .attr('height', MAP_H)
      .style('position', 'relative')
      .style('z-index', '1');

    const projected = projectCoords(gps.coordinates);
    const transform = fitProjection(projected, CELL_W, MAP_H, PAD);
    const points = projected.map(transform);

    const color = variant === 'standard' ? '#2a7a5a' : '#1a5c40';

    const line = d3.line().x(d => d[0]).y(d => d[1]);

    // Ghost layer
    svg.append('path')
      .attr('class', 'ghost-path')
      .attr('fill', 'none')
      .attr('stroke', 'none')
      .attr('stroke-width', 2);

    // Route outline for contrast against map
    svg.append('path')
      .datum(points)
      .attr('d', line)
      .attr('fill', 'none')
      .attr('stroke', '#fff')
      .attr('stroke-width', 5)
      .attr('stroke-linecap', 'round')
      .attr('stroke-linejoin', 'round')
      .attr('opacity', 0.7);

    // Route path
    svg.append('path')
      .datum(points)
      .attr('class', 'route-path')
      .attr('d', line)
      .attr('fill', 'none')
      .attr('stroke', color)
      .attr('stroke-width', 2.5)
      .attr('stroke-linecap', 'round')
      .attr('stroke-linejoin', 'round');

    // Start point
    svg.append('circle')
      .attr('cx', points[0][0]).attr('cy', points[0][1])
      .attr('r', 5)
      .attr('fill', color)
      .attr('stroke', '#fff').attr('stroke-width', 2);

    // End point
    const last = points[points.length - 1];
    svg.append('circle')
      .attr('cx', last[0]).attr('cy', last[1])
      .attr('r', 5)
      .attr('fill', color)
      .attr('stroke', '#fff').attr('stroke-width', 2);

    // Scrubber bob (hidden until elevation hover)
    const bob = svg.append('circle')
      .attr('r', 7)
      .attr('fill', '#e63946')
      .attr('stroke', '#fff').attr('stroke-width', 2.5)
      .style('display', 'none')
      .style('filter', 'drop-shadow(0 1px 3px rgba(0,0,0,0.4))');

    return { points, bob };
  }

  function drawElevation(container, elevations, variant) {
    const svg = d3.select(container)
      .append('svg')
      .attr('width', CELL_W)
      .attr('height', ELEV_H);

    const color = variant === 'standard' ? '#2a7a5a' : '#1a5c40';

    const x = d3.scaleLinear().domain([0, elevations.length - 1]).range([0, CELL_W]);
    const y = d3.scaleLinear()
      .domain([d3.min(elevations), d3.max(elevations)])
      .range([ELEV_H - 2, 6]);

    // White backdrop for contrast
    svg.append('rect')
      .attr('width', CELL_W).attr('height', ELEV_H)
      .attr('fill', '#fff').attr('opacity', 0.85);

    const area = d3.area()
      .x((d, i) => x(i))
      .y0(ELEV_H)
      .y1((d) => y(d));

    svg.append('path')
      .datum(elevations)
      .attr('d', area)
      .attr('fill', color)
      .attr('fill-opacity', 0.2);

    const line = d3.line()
      .x((d, i) => x(i))
      .y((d) => y(d));

    svg.append('path')
      .datum(elevations)
      .attr('d', line)
      .attr('fill', 'none')
      .attr('stroke', color)
      .attr('stroke-width', 1.5);

    // Cursor line for scrubber
    const cursor = svg.append('line')
      .attr('y1', 0).attr('y2', ELEV_H)
      .attr('stroke', '#e63946').attr('stroke-width', 1.5)
      .style('display', 'none');

    // Elevation dot on the profile line
    const elevDot = svg.append('circle')
      .attr('r', 4)
      .attr('fill', '#e63946')
      .attr('stroke', '#fff').attr('stroke-width', 1.5)
      .style('display', 'none');

    return { cursor, elevDot, xScale: x, yScale: y };
  }

  function wireScrubber(elevDiv, elevResult, mapResult, route, cell) {
    const { cursor, elevDot, xScale, yScale } = elevResult;
    const { points, bob } = mapResult;
    const elevations = route.elevations;
    const numPts = points.length;
    const numElevs = elevations.length;

    // Tooltip element
    const tip = document.createElement('div');
    tip.className = 'elev-tooltip';
    cell.appendChild(tip);

    let isDragging = false;

    function updatePosition(mx) {
      // mx is pixel position within the elevation SVG (0 to CELL_W)
      const frac = Math.max(0, Math.min(1, mx / CELL_W));

      // Move cursor on elevation profile
      const elevIdx = Math.round(frac * (numElevs - 1));
      const px = xScale(elevIdx);
      cursor.attr('x1', px).attr('x2', px).style('display', null);
      elevDot
        .attr('cx', px)
        .attr('cy', yScale(elevations[elevIdx]))
        .style('display', null);

      // Move bob on map
      const mapIdx = Math.round(frac * (numPts - 1));
      const pt = points[mapIdx];
      bob.attr('cx', pt[0]).attr('cy', pt[1]).style('display', null);

      // Tooltip
      const distKm = (frac * route.distance_km).toFixed(1);
      const elev = Math.round(elevations[elevIdx]);
      tip.textContent = distKm + ' km · ' + elev + 'm';
      tip.style.display = 'block';
      tip.style.left = Math.max(40, Math.min(CELL_W - 40, px)) + 'px';
    }

    function hide() {
      cursor.style('display', 'none');
      elevDot.style('display', 'none');
      bob.style('display', 'none');
      tip.style.display = 'none';
      isDragging = false;
    }

    const el = elevDiv;

    el.addEventListener('pointerdown', function(e) {
      isDragging = true;
      el.setPointerCapture(e.pointerId);
      const rect = el.getBoundingClientRect();
      updatePosition(e.clientX - rect.left);
      e.preventDefault();
    });

    el.addEventListener('pointermove', function(e) {
      if (!isDragging) return;
      const rect = el.getBoundingClientRect();
      updatePosition(e.clientX - rect.left);
    });

    el.addEventListener('pointerup', function() {
      isDragging = false;
    });

    el.addEventListener('pointercancel', function() {
      hide();
    });

    el.addEventListener('mousemove', function(e) {
      if (isDragging) return; // pointer events handle drag
      const rect = el.getBoundingClientRect();
      updatePosition(e.clientX - rect.left);
    });

    el.addEventListener('mouseleave', function() {
      if (!isDragging) hide();
    });
  }

  function toggleSelect(key, day, variant) {
    selectedKey = selectedKey === key ? null : key;
    updateSelection();
  }

  function updateSelection() {
    Object.keys(cellMap).forEach(k => {
      const cell = cellMap[k];
      cell.classList.remove('selected');
      const svg = cell.querySelector('.map-area svg');
      if (svg) {
        const ghost = svg.querySelector('.ghost-path');
        if (ghost) {
          ghost.setAttribute('stroke', 'none');
          ghost.setAttribute('d', '');
        }
      }
    });

    if (!selectedKey) return;

    const selCell = cellMap[selectedKey];
    if (selCell) selCell.classList.add('selected');

    const day = parseInt(selCell.dataset.day);
    const variant = selCell.dataset.variant;
    const otherVariant = variant === 'standard' ? 'long' : 'standard';
    const otherKey = gpsKey(day, otherVariant);
    const otherGps = ROUTE_GPS[otherKey];

    if (!otherGps) return;

    drawGhostInCell(selectedKey, otherGps, otherVariant);

    const selGps = ROUTE_GPS[selectedKey];
    if (cellMap[otherKey] && selGps) {
      drawGhostInCell(otherKey, selGps, variant);
    }
  }

  function drawGhostInCell(cellKey, ghostGps, ghostVariant) {
    const cell = cellMap[cellKey];
    if (!cell) return;

    const svg = cell.querySelector('.map-area svg');
    if (!svg) return;

    const cellDay = parseInt(cell.dataset.day);
    const cellVariant = cell.dataset.variant;
    const cellGps = ROUTE_GPS[gpsKey(cellDay, cellVariant)];

    const cellProjected = projectCoords(cellGps.coordinates);
    const transform = fitProjection(cellProjected, CELL_W, MAP_H, PAD);

    const ghostProjected = projectCoords(ghostGps.coordinates);
    const ghostPoints = ghostProjected.map(transform);

    const ghostColor = ghostVariant === 'standard' ? '#2a7a5a' : '#1a5c40';

    const line = d3.line().x(d => d[0]).y(d => d[1]);
    const ghostPath = svg.querySelector('.ghost-path');
    ghostPath.setAttribute('d', line(ghostPoints));
    ghostPath.setAttribute('stroke', ghostColor);
    ghostPath.setAttribute('stroke-opacity', '0.25');
    ghostPath.setAttribute('stroke-width', '2');
  }

})();
</script>

</body>
</html>
